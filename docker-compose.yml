services:
    notification-service:
        build:
            context: .
            dockerfile: apps/notification-service/Dockerfile
        # Don't expose ports in production - only internal access
        # ports:
        #   - "4000:4000"
        env_file:
            - ./apps/notification-service/.env.production
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:4000/api/health').then(r=>r.ok?process.exit(0):process.exit(1))",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
                reservations:
                    cpus: "0.1"
                    memory: 64M
        networks:
            - app-network
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
            - "50051:50051"
        env_file:
            - .env.production
        environment:
            - NODE_ENV=production
            - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/releases
            - REDIS_URL=redis://redis:6379
            - APP_VERSION=${APP_VERSION:-1.0.1}
            - NOTIFICATION_SERVICE_URL=http://notification-service:4000
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            notification-service:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1))",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 512M
                reservations:
                    cpus: "0.25"
                    memory: 128M
        networks:
            - app-network
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-releases}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
        # Don't expose ports in production - only internal access
        # ports:
        #   - '5432:5432'
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-releases}"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
                reservations:
                    cpus: "0.1"
                    memory: 64M
        networks:
            - app-network
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    redis:
        image: redis:7.4-alpine
        # Don't expose ports in production - only internal access
        # ports:
        #   - '6379:6379'
        command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 128M
                reservations:
                    cpus: "0.05"
                    memory: 32M
        networks:
            - app-network
        logging:
            driver: "json-file"
            options:
                max-size: "5m"
                max-file: "3"

    prometheus:
        image: prom/prometheus:v2.54.1
        profiles: ["monitoring"]
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            - "--web.enable-lifecycle"
        ports:
            - "127.0.0.1:9090:9090"
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        depends_on:
            app:
                condition: service_healthy
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
                reservations:
                    cpus: "0.1"
                    memory: 64M
        networks:
            - app-network
        logging:
            driver: "json-file"
            options:
                max-size: "5m"
                max-file: "3"

    grafana:
        image: grafana/grafana:11.3.1
        profiles: ["monitoring"]
        ports:
            - "127.0.0.1:3001:3000"
        environment:
            - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
            - GF_USERS_ALLOW_SIGN_UP=false
            - GF_AUTH_ANONYMOUS_ENABLED=false
            - GF_LOG_LEVEL=warn
        volumes:
            - ./grafana/provisioning:/etc/grafana/provisioning:ro
            - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana_data:/var/lib/grafana
        depends_on:
            - prometheus
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
                reservations:
                    cpus: "0.1"
                    memory: 64M
        networks:
            - app-network
        logging:
            driver: "json-file"
            options:
                max-size: "5m"
                max-file: "3"

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        profiles: ["elk"]
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
            - ES_JAVA_OPTS=-Xms512m -Xmx512m
            - cluster.name=github-notifier-cluster
        ports:
            - "127.0.0.1:9200:9200"
        volumes:
            - elasticsearch_data:/usr/share/elasticsearch/data
        healthcheck:
            test:
                ["CMD-SHELL", 'curl -sf http://localhost:9200/_cluster/health | grep -qE ''"status":"(green|yellow)"''']
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 60s
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 1G
                reservations:
                    cpus: "0.25"
                    memory: 512M
        networks:
            - app-network
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    kibana:
        image: docker.elastic.co/kibana/kibana:8.15.3
        profiles: ["elk"]
        environment:
            - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
            - SERVER_NAME=kibana
            - SERVER_HOST=0.0.0.0
            - LOGGING_ROOT_LEVEL=warn
        ports:
            - "127.0.0.1:5601:5601"
        depends_on:
            elasticsearch:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q available"]
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 90s
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 1G
                reservations:
                    cpus: "0.1"
                    memory: 256M
        networks:
            - app-network
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    filebeat:
        image: docker.elastic.co/beats/filebeat:8.15.3
        profiles: ["elk"]
        user: root
        command: filebeat -e --strict.perms=false
        volumes:
            - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - filebeat_data:/usr/share/filebeat/data
        depends_on:
            elasticsearch:
                condition: service_healthy
        environment:
            - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
            - KIBANA_HOST=http://kibana:5601
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 128M
                reservations:
                    cpus: "0.05"
                    memory: 64M
        networks:
            - app-network
        logging:
            driver: "json-file"
            options:
                max-size: "5m"
                max-file: "3"

networks:
    app-network:
        driver: bridge
        internal: false # Set to true for fully isolated network

volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
    prometheus_data:
        driver: local
    grafana_data:
        driver: local
    elasticsearch_data:
        driver: local
    filebeat_data:
        driver: local
