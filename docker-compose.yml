services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
            - "50051:50051"
        env_file:
            - .env.production
        environment:
            - NODE_ENV=production
            - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/releases
            - REDIS_URL=redis://redis:6379
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1))",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 512M
                reservations:
                    cpus: "0.25"
                    memory: 128M
        networks:
            - app-network
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-releases}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
        # Don't expose ports in production - only internal access
        # ports:
        #   - '5432:5432'
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-releases}"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
                reservations:
                    cpus: "0.1"
                    memory: 64M
        networks:
            - app-network
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    redis:
        image: redis:7.4-alpine
        # Don't expose ports in production - only internal access
        # ports:
        #   - '6379:6379'
        command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 128M
                reservations:
                    cpus: "0.05"
                    memory: 32M
        networks:
            - app-network
        logging:
            driver: "json-file"
            options:
                max-size: "5m"
                max-file: "3"

networks:
    app-network:
        driver: bridge
        internal: false # Set to true for fully isolated network

volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
