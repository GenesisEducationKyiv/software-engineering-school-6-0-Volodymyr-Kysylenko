name: CI

on:
    push:
        branches: ["**"]

    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10.0.0
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate gRPC types
              run: pnpm run proto:gen

            - name: Check formatting
              run: pnpm run format:check

            - name: Run linter
              run: pnpm run lint

            - name: Type check
              run: pnpm run typecheck

            - name: Build project
              run: pnpm run build

    test:
        runs-on: ubuntu-latest
        needs: quality

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: releases
                    POSTGRES_USER: postgres
                options: >-
                    --health-cmd "pg_isready -U postgres -d releases"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432

            redis:
                image: redis:7.4-alpine
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 6379:6379

            mailhog:
                image: mailhog/mailhog:latest
                ports:
                    - 1025:1025
                    - 8025:8025

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10.0.0
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate gRPC types
              run: pnpm run proto:gen

            - name: Run tests
              run: pnpm run test:ci
