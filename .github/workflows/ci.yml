name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x]

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: releases
                    POSTGRES_USER: postgres
                options: >-
                    --health-cmd "pg_isready -U postgres -d releases"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432

            redis:
                image: redis:7.4-alpine
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 6379:6379

            mailhog:
                image: mailhog/mailhog:latest
                ports:
                    - 1025:1025
                    - 8025:8025

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: latest
                  run_install: false

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run linter
              run: pnpm run lint

            - name: Build project
              run: pnpm run build
              env:
                  NODE_ENV: test
                  PORT: 3000
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/releases
                  REDIS_URL: redis://localhost:6379
                  APP_BASE_URL: http://localhost:3000
                  SMTP_HOST: localhost
                  SMTP_PORT: 1025
                  SMTP_EMAIL_FROM: test@example.com
                  SMTP_SECURE: false
                  CACHE_ENABLED: false
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Run tests
              run: pnpm run test
              env:
                  NODE_ENV: test
                  PORT: 3000
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_releases
                  REDIS_URL: redis://localhost:6379
                  APP_BASE_URL: http://localhost:3000
                  SMTP_HOST: localhost
                  SMTP_PORT: 1025
                  SMTP_EMAIL_FROM: test@example.com
                  SMTP_SECURE: false
                  CACHE_ENABLED: false
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}