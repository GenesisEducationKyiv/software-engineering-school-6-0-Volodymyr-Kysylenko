filebeat.inputs:
    - type: container
      paths:
          - /var/lib/docker/containers/*/*.log
      processors:
          - add_docker_metadata:
                host: "unix:///var/run/docker.sock"

processors:
    - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true
          add_error_key: true

    - drop_fields:
          fields:
              - "agent.ephemeral_id"
              - "ecs.version"
              - "input.type"
          ignore_missing: true

output.elasticsearch:
    hosts: ["${ELASTICSEARCH_HOSTS:elasticsearch:9200}"]
    indices:
        - index: "github-notifier-logs-%{+yyyy.MM.dd}"
          when:
              or:
                  - equals:
                        container.labels.com_docker_compose_service: "app"
                  - equals:
                        container.labels.com_docker_compose_service: "notification-service"
        - index: "docker-logs-%{+yyyy.MM.dd}"

setup.template.enabled: false
setup.ilm.enabled: false

logging.level: warning
logging.to_files: false
