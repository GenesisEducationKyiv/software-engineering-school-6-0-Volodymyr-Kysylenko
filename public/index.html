<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GitHub Release Notifier | Home</title>
        <link rel="stylesheet" href="/assets/app.css" />
    </head>
    <body>
        <main class="page">
            <section class="card">
                <h1 class="title">Підписка на GitHub релізи</h1>
                <p class="subtitle">Отримуйте сповіщення електронною поштою, коли в обраному GitHub-репозиторії з'явиться новий реліз.</p>

                <form class="form" id="subscribe-form">
                    <div class="field">
                        <label class="label" for="email">Електронна пошта</label>
                        <input class="input" id="email" name="email" type="email" placeholder="you@example.com" required />
                    </div>

                    <div class="field">
                        <label class="label" for="repo">GitHub репозиторій</label>
                        <input class="input" id="repo" name="repo" type="text" placeholder="golang/go" required />
                        <div class="hint">Формат: <span class="example">owner/repo</span></div>
                    </div>

                    <button class="button" id="submit-button" type="submit">Підписатися</button>

                    <a href="/subscriptions" class="button button--secondary"> Переглянути підписки </a>
                </form>

                <div id="message" class="message"></div>

                <div class="footer">Після підписки на вашу електронну пошту буде надіслано лист для підтвердження.</div>
            </section>
        </main>

        <script src="/assets/home.js"></script>
    </body>
</html>
