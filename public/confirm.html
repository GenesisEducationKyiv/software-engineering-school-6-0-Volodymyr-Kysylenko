<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GitHub Release Notifier | Confirm</title>
        <link rel="stylesheet" href="/assets/app.css" />
    </head>
    <body>
        <main class="page">
            <section class="card">
                <h1 class="title">Підписку підтверджено!</h1>
                <p class="subtitle">Тепер ви отримуватимете сповіщення електронною поштою про нові релізи цього репозиторію.</p>

                <div class="message message--success">
                    Підписка успішно активована. Сповіщення будуть надходити автоматично при появі нових релізів репозиторію.
                </div>

                <div class="buttons">
                    <a href="/" class="button"> Створити нову підписку </a>
                    <a href="/subscriptions" class="button button--secondary"> Переглянути підписки </a>
                </div>
            </section>
        </main>
    </body>
</html>
