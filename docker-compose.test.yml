services:
    notification-service:
        build:
            context: .
            dockerfile: apps/notification-service/Dockerfile
        ports:
            - "4000:4000"
        env_file:
            - ./apps/notification-service/.env.test
        environment:
            - RABBITMQ_URL=amqp://notifier:notifier@rabbitmq:5672
            - REDIS_URL=redis://redis:6379
        depends_on:
            mailhog:
                condition: service_started
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:4000/api/health/ready').then(r=>r.ok?process.exit(0):process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s

    outbox-worker:
        build:
            context: .
            dockerfile: Dockerfile
        command: ["node", "dist/outbox-worker.js"]
        env_file:
            - .env.test
        environment:
            - DATABASE_URL=postgresql://postgres:postgres@db:5432/releases_test
            - RABBITMQ_URL=amqp://notifier:notifier@rabbitmq:5672
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:3100/health/ready').then(r=>r.ok?process.exit(0):process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s

    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: releases_test
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "15432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d releases_test"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    redis:
        image: redis:7.4-alpine
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 5s

    mailhog:
        image: mailhog/mailhog:latest
        ports:
            - "1025:1025"
            - "8025:8025"

    rabbitmq:
        image: rabbitmq:3.13-management-alpine
        environment:
            - RABBITMQ_DEFAULT_USER=notifier
            - RABBITMQ_DEFAULT_PASS=notifier
        ports:
            - "5672:5672"
            - "15672:15672"
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
