services:
    notification-service:
        build:
            context: .
            dockerfile: apps/notification-service/Dockerfile
        ports:
            - "4000:4000"
        env_file:
            - ./apps/notification-service/.env.test
        depends_on:
            - mailhog
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:4000/api/health').then(r=>r.ok?process.exit(0):process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s

    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: releases_test
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "15432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d releases_test"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    redis:
        image: redis:7.4-alpine
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 5s

    mailhog:
        image: mailhog/mailhog:latest
        ports:
            - "1025:1025"
            - "8025:8025"
